<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sign in · EasyRunners</title>
    <script src="/static/theme.js?v={{ asset_version }}"></script>
    <link rel="stylesheet" href="/static/app.css?v={{ asset_version }}">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <div class="brand login-brand"><span class="brand-mark" aria-hidden="true">E</span><span>EasyRunners</span></div>
      <div class="login-heading">
        <h1>Sign in</h1>
        <p>Enter your administrator password.</p>
      </div>
      {% if error %}<div class="alert danger" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/auth/login">
        <input type="hidden" name="next_url" value="{{ next_url or '/' }}">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="submit">Sign in</button>
      </form>
      <p class="login-help">First login? Run <code>docker compose logs manager</code> to find the temporary password.</p>
    </main>
  </body>
</html>
