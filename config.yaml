manager:
  reconcile_interval: 10
  queue_poll_interval: 60
  full_poll_interval: 300
  poll_concurrency: 5
  history_limit: 500
  runner_log_capture_enabled: true
  runner_log_cleanup_enabled: true
  runner_log_retention_days: 7

  # Optional generic JSON webhook for operational failures. Prefer setting the
  # URL and signing secret through environment variables instead of this file.
  notification_stuck_job_seconds: 900
  notification_cooldown_seconds: 900

runner_pools:
  # Recommended for tests, linting, and builds that do not invoke Docker.
  ci:
    labels: [self-hosted, linux, ci]
    min: 0
    max: 5
    priority: 20
    cpu: 4
    memory: 8g
    pids_limit: 1024
    idle_timeout: 60
    job_timeout: 3600
    max_lifetime: 3900
    docker_mode: none

  # Use only for workflows that actually need Docker builds or containers.
  default:
    labels: [self-hosted, linux, docker]
    min: 0
    max: 5
    priority: 0
    cpu: 4
    memory: 8g
    pids_limit: 1024
    idle_timeout: 60
    job_timeout: 3600
    max_lifetime: 3900
    docker_mode: socket

  # Rust uses the same universal image and stays away from the Docker socket.
  rust:
    labels: [self-hosted, linux, rust]
    min: 0
    max: 5
    priority: 10
    cpu: 4
    memory: 8g
    pids_limit: 1024
    idle_timeout: 60
    job_timeout: 3600
    max_lifetime: 3900
    docker_mode: none

  # Keep deploy credentials and mounts out of the default CI pool.
  # deploy:
  #   labels: [self-hosted, linux, deploy]
  #   min: 0
  #   max: 1
  #   priority: 10
  #   cpu: 2
  #   memory: 4g
  #   docker_mode: none
  #   environment_from: [DEPLOY_TOKEN]
