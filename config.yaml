manager:
  reconcile_interval: 10
  queue_poll_interval: 60
  # Webhooks provide immediate scaling. This slower sweep only repairs missed events.
  full_poll_interval: 900
  poll_concurrency: 2
  # Workflow migration scans run only when requested from the dashboard. This
  # limits repositories per scan; new and unverified repositories are checked first.
  adoption_runs_per_repo: 5
  adoption_max_repositories: 100
  history_limit: 500
  runner_log_capture_enabled: true
  runner_log_cleanup_enabled: true
  runner_log_retention_days: 7

  # Optional generic JSON webhook for operational failures. Prefer setting the
  # URL and signing secret through environment variables instead of this file.
  notification_stuck_job_seconds: 900
  notification_cooldown_seconds: 900

runner_pools:
  # Recommended for tests, linting, compilation, and other ordinary jobs.
  standard:
    labels: [self-hosted, linux, standard]
    # Keep existing ci/rust workflow labels working while repositories migrate.
    aliases: [ci, rust]
    min: 0
    max: 5
    priority: 20
    cpu: 4
    memory: 8g
    pids_limit: 1024
    idle_timeout: 60
    job_timeout: 3600
    max_lifetime: 3900
    docker_mode: none

  # Use only for workflows that actually need Docker builds or containers.
  docker:
    labels: [self-hosted, linux, docker]
    min: 0
    max: 5
    priority: 0
    cpu: 4
    memory: 8g
    pids_limit: 1024
    idle_timeout: 60
    job_timeout: 3600
    max_lifetime: 3900
    docker_mode: socket

  # Keep deploy credentials and mounts out of the standard pool.
  # deploy:
  #   labels: [self-hosted, linux, deploy]
  #   min: 0
  #   max: 1
  #   priority: 10
  #   cpu: 2
  #   memory: 4g
  #   docker_mode: none
  #   environment_from: [DEPLOY_TOKEN]
