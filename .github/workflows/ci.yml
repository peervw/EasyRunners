name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Keep this on the existing Docker pool so upgrades cannot deadlock before a
    # newly added pool has been deployed. New installations should use `ci` for
    # jobs that do not need Docker.
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=runner_manager --cov-fail-under=75
      - run: uv lock --check

  containers:
    runs-on: [self-hosted, linux, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            target: manager
          - dockerfile: runner/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Validate Compose configuration
        run: |
          if docker compose version >/dev/null 2>&1; then
            PUBLIC_URL=https://runners.example.com docker compose config >/dev/null
          else
            echo "::warning::Compose validation requires the updated EasyRunners image"
          fi
      - name: Build ${{ matrix.target }} for amd64 and arm64
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file ${{ matrix.dockerfile }}
          --target ${{ matrix.target }}
          .
