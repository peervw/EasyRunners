name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    # Keep this on the existing Docker pool so upgrades cannot deadlock before a
    # newly added pool has been deployed. New installations should use `ci` for
    # jobs that do not need Docker.
    runs-on: [self-hosted, linux, docker]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          enable-cache: true
      - run: uv sync --frozen --all-groups
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run pytest --cov=runner_manager --cov-fail-under=75
      - run: uv lock --check

  containers:
    runs-on: [self-hosted, linux, docker]
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: Dockerfile
            target: manager
          - dockerfile: runner/Dockerfile
            target: runner
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Validate Compose configuration
        run: |
          if docker compose version >/dev/null 2>&1; then
            PUBLIC_URL=https://runners.example.com docker compose config >/dev/null
          else
            echo "::warning::Compose validation requires the updated EasyRunners image"
          fi
      - name: Build ${{ matrix.target }} for amd64 and arm64
        run: >-
          docker buildx build
          --platform linux/amd64,linux/arm64
          --file ${{ matrix.dockerfile }}
          --target ${{ matrix.target }}
          .
