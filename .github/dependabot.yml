version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Berlin
    groups:
      python-dependencies:
        patterns: ["*"]
    labels: [dependencies, python]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:30"
      timezone: Europe/Berlin
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]
    open-pull-requests-limit: 5
